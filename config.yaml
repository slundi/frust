filters:
- slug: "guitar-standard"
  # sentences or regexes should be defined
  expressions: ["guitar", "E standard"]  # match words/sentences of this list
  is_regex: false
  must_match_all: false  # OPTIONAL default `false`: if all defined sentences and regexes should match, default a result is valid when one of the regexes/sentences match
  filter_in_title: true  # default true
  filter_in_summary: true  # default true
  filter_in_content: false  # default true
  keep: false  # `true` to only keep matching articles, default `false` to exclude them
- slug: "favorite-bands"
  expressions: ["Ghost", "Iron Maiden", "Judas Priest" ]
- slug: "unwanted-instruments"
  expressions: ["trumpet", "drum"]

groups:
- title: My group name  # shown as the title of the exported feed
  # slug: my-group-name  # OPTIONAL, derived from the title
  output: my-group-name.xml
  filters: []
  # retention: 60  # retention in days
  feeds:
  - title: "Feed title"
    url: "https://my-favourite-website.org/rss"  # feed URL
    page_url: "https://my-favourite-website.org/"  # OPTIONAL website, available as {{feed.page_url}} and exported to OPML
    # content_mode: default  # OPTIONAL default, no, brief, force (scrape the article page) or links_only
    # selector: "article"    # OPTIONAL CSS selector of the article body, with `content_mode: force`
    retention: 60  # retention in days
    filters: ["unwanted-instruments", "favorite-bands"]  # applied filters, order is important
