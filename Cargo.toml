[package]
name = "frust-feed"
authors = ["Sébastien LUNDI <slundi@ikmail.com>"]
version = "0.2.1"
edition = "2024"
description = "CLI RSS aggregator"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/slundi/frust"
categories = ["command-line-utilities", "data-structures"]
keywords = ["cli", "rss", "atom", "feed", "aggregator"]
publish = true

[[bin]]
name = "frust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
saphyr = { version = "0.0.6", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twox-hash = "2.1.2"
slug = "0.1.6"
url = "2.5.8"
regex = "1.12.3"
futures = "0.3.32"
reqwest = "0.13.4"
feed-rs = { version = "2.3.1", features = ["sanitize"] }
chrono = "0.4.45"
scraper = "0.27"
htmd = "0.5.4"
mediatype = "0.19"
redb = "4.1"
rkyv = { version = "0.8.16", features = ["bytecheck"] }
quick-xml = { version = "0.40", features = ["serialize"] }
lz4_flex = "0.13.1"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
epub-builder = "0.8.3"
pulldown-cmark = "0.13.4"
argh = "0.1.19"
zip = "8.6"

[dev-dependencies]
tempfile = "3.27"
