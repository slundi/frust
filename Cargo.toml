[package]
name = "frust-feed"
authors = ["Sébastien LUNDI <slundi@ikmail.com>"]
version = "0.2.6"
edition = "2024"
description = "CLI RSS aggregator"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/slundi/frust"
categories = ["command-line-utilities", "data-structures"]
keywords = ["cli", "rss", "atom", "feed", "aggregator"]
publish = true

[[bin]]
name = "frust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
saphyr = { version = "0.3.4", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0"
twox-hash = "2.1.3"
slug = "0.1.6"
url = "2.5.8"
regex = "1.13.2"
futures = "0.3.34"
reqwest = "0.13.4"
feed-rs = { version = "3.0.0", features = ["sanitize"] }
chrono = "0.4.45"
scraper = "0.29"
htmd = "0.6.0"
mediatype = "0.23.0"
redb = "5.0"
rkyv = { version = "0.8.17", features = ["bytecheck"] }
quick-xml = { version = "0.42", features = ["serialize"] }
lz4_flex = "0.14.2"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pulldown-cmark = "0.13.4"
argh = "0.1.19"
# Writing Deflate archives (EPUB, ZIP export) is all we need: no bzip2, lzma,
# zstd, ppmd, AES or zopfli (smaller binary, no bzip2/CC0 licenses).
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3.27"
